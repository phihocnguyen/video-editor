# Attach the installer built by Build to a GitHub Release.
# Release calls this last. The .exe is the cutline-windows-setup artifact
# from the same workflow run.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: cutline-windows-setup
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer found in cutline-windows-setup"
            exit 1
          fi
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          else
            draft_flag=()
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Cutline $TAG" \
              "${draft_flag[@]}"
          fi
