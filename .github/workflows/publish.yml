# Attach the installer built by Build to a GitHub Release.
# Release calls this last. The .exe is the cutline-windows-setup artifact
# from the same workflow run.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Upload release
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: cutline-windows-setup
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer found in cutline-windows-setup"
            exit 1
          fi
          src="${files[0]}"
          for f in "${files[@]}"; do
            case "$f" in
              *[Ss]etup.exe) src="$f"; break ;;
            esac
          done
          cp "$src" release-assets/Cutline-windows-setup.exe
          files=("$src" release-assets/Cutline-windows-setup.exe)
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          else
            draft_flag=()
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Cutline $TAG" \
              "${draft_flag[@]}"
          fi

      - name: Refresh marketing site
        if: inputs.draft == false
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set. The download link updates on the next Vercel deploy."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
