# One button. Runs the other workflows in order and stops on the first failure:
# CI (typecheck + test) → Tag (bump + vX.Y.Z) → Build (Windows .exe) → Publish (GitHub Release).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Auto-bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version without leading v (overrides bump)"
        required: false
        type: string
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: cutline-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ci:
    name: Check
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag
    needs: ci
    uses: ./.github/workflows/tag.yml
    with:
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}

  build:
    name: Build
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      ref: v${{ needs.tag.outputs.version }}

  publish:
    name: Publish
    needs: [tag, build]
    uses: ./.github/workflows/publish.yml
    with:
      tag: v${{ needs.tag.outputs.version }}
      draft: ${{ inputs.draft }}
